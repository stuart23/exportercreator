name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Unit tests
        # -race: the router is written to from observer callbacks while the export
        # path reads it, and an unsynchronized read there is invisible without it.
        run: go test -race ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7
