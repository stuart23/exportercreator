name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check generated metadata is up to date
        env:
          MDATAGEN_VERSION: v0.159.0
        run: |
          # mdatagen cannot be `go install`ed: its go.mod carries replace directives, so it
          # has to be built from a collector checkout.
          git clone --depth 1 --branch "$MDATAGEN_VERSION" \
            https://github.com/open-telemetry/opentelemetry-collector.git "$RUNNER_TEMP/collector"
          (cd "$RUNNER_TEMP/collector/cmd/mdatagen" && go build -o "$RUNNER_TEMP/mdatagen" .)
          "$RUNNER_TEMP/mdatagen" metadata.yaml
          # Intent-to-add first: git diff ignores untracked files, so a generated file that
          # is new rather than changed would leave the tree dirty and still pass.
          git add -AN .
          git diff --exit-code

      - name: Unit tests
        # -race: the router is written to from observer callbacks while the export
        # path reads it, and an unsynchronized read there is invisible without it.
        run: go test -race ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7
