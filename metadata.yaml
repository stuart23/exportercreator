type: exporter_creator

status:
  class: exporter
  stability:
    development: [ logs, metrics, traces ]
  distributions: []
  codeowners:
    active: [ stu ]

attributes:
  endpoint_type:
    description: Kind of resource the endpoint describes, as reported by the observer.
    type: string
  exporter_type:
    description: Type of the exporter created from the matching template.
    type: string
  observer_type:
    description: Type of the observer extension that reported the endpoint, as named in watch_observers.
    type: string

telemetry:
  metrics:
    exporter_creator_exporters_count:
      enabled: true
      stability: development
      description: Current number of exporters created by the exporter_creator.
      unit: "{exporters}"
      attributes: [exporter_type]
      gauge:
        value_type: int
    exporter_creator_nonroutable_log_records_total:
      enabled: true
      stability: development
      description: Total number of log records that could not be routed to any exporter.
      unit: "{records}"
      sum:
        value_type: int
        aggregation_temporality: cumulative
        monotonic: true
    exporter_creator_nonroutable_metric_points_total:
      enabled: true
      stability: development
      description: Total number of metric points that could not be routed to any exporter.
      unit: "{metric_points}"
      sum:
        value_type: int
        aggregation_temporality: cumulative
        monotonic: true
    exporter_creator_nonroutable_spans_total:
      enabled: true
      stability: development
      description: Total number of spans that could not be routed to any exporter.
      unit: "{spans}"
      sum:
        value_type: int
        aggregation_temporality: cumulative
        monotonic: true
    exporter_creator_observed_endpoints:
      enabled: true
      stability: development
      description: Current number of endpoints reported by the observers being watched.
      unit: "{endpoints}"
      attributes: [observer_type, endpoint_type]
      gauge:
        value_type: int

tests:
  skip_lifecycle: true
  skip_shutdown: true
