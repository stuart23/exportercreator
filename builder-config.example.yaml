# Example OpenTelemetry Collector Builder manifest for a custom distribution that includes
# exporter_creator.
#
# Layout: run the builder from a directory whose *parent* contains both this repo and a
# contrib checkout (e.g. my-workspace/builder-config.example.yaml with my-workspace/exportercreator
# and my-workspace/opentelemetry-collector-contrib). Replaces are resolved relative to output_path.
#
# Build: builder --config=builder-config.example.yaml

dist:
  name: otelcol-exportercreator
  description: Example collector with exporter_creator
  output_path: ./_ocb_out

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.151.0
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.151.0
  - gomod: github.com/stuart23/exportercreator v0.0.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.151.0

extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/observer/jsonfileobserver v0.151.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.151.0

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.57.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.57.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/yamlprovider v1.57.0

replaces:
  - github.com/stuart23/exportercreator => ../exportercreator
  - github.com/open-telemetry/opentelemetry-collector-contrib => ../opentelemetry-collector-contrib
  - github.com/open-telemetry/opentelemetry-collector-contrib/extension/observer => ../opentelemetry-collector-contrib/extension/observer
  - github.com/open-telemetry/opentelemetry-collector-contrib/extension/observer/jsonfileobserver => ../opentelemetry-collector-contrib/extension/observer/jsonfileobserver
